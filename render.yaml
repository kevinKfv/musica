services:
  # -------------------------------------------------------------
  # Backend Web Service (Spring Boot en Docker - 100% Free Plan)
  # -------------------------------------------------------------
  - type: web
    name: bandhub-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PGHOST
        fromDatabase:
          name: bandhub-db
          property: host
      - key: PGPORT
        fromDatabase:
          name: bandhub-db
          property: port
      - key: PGDATABASE
        fromDatabase:
          name: bandhub-db
          property: database
      - key: PGUSER
        fromDatabase:
          name: bandhub-db
          property: user
      - key: PGPASSWORD
        fromDatabase:
          name: bandhub-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.pages.dev,http://localhost:5173
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: None

# -----------------------------------------------------------------
# Base de Datos PostgreSQL (100% Free Plan en Render)
# -----------------------------------------------------------------
databases:
  - name: bandhub-db
    databaseName: bandhub_db
    user: bandhub_user
    plan: free
    region: oregon
