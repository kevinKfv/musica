server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: BandHub
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:bandhub_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${PGUSER:bandhub_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${PGPASSWORD:bandhub_password}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: false

  modulith:
    events:
      jdbc-schema-initialization-enabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDISHOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDISPORT:6379}}
      password: ${SPRING_DATA_REDIS_PASSWORD:${REDISPASSWORD:}}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000} # 15 minutes
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

cookie:
  secure: ${COOKIE_SECURE:true}
  same-site: ${COOKIE_SAME_SITE:None}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:8080,https://*.pages.dev,https://*.onrender.com,https://*.up.railway.app,https://*.railway.app}

