# ============================================================
#  BandHub — Docker Compose (desde /docker/)
#  Uso: docker compose -f docker/docker-compose.yml up -d
#  Recomendado: usar el docker-compose.yml en la raíz del proyecto
# ============================================================
name: bandhub

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bandhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-bandhub_db}
      POSTGRES_USER:     ${POSTGRES_USER:-bandhub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bandhub_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bandhub_user} -d ${POSTGRES_DB:-bandhub_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bandhub-net

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: bandhub-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - bandhub-net

  # ── MinIO ───────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: bandhub-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ROOT_USER:-bandhub_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bandhub_minio_dev}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - bandhub-net

  # ── Backend (Spring Boot) ────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: bandhub-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL:      jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bandhub_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bandhub_user}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bandhub_dev_password}
      SPRING_DATA_REDIS_HOST:     redis
      SPRING_DATA_REDIS_PORT:     6379
      MINIO_ENDPOINT:             http://minio:9000
      MINIO_ACCESS_KEY:           ${MINIO_ROOT_USER:-bandhub_minio}
      MINIO_SECRET_KEY:           ${MINIO_ROOT_PASSWORD:-bandhub_minio_dev}
      JWT_SECRET:                  ${JWT_SECRET:-bandhub_dev_jwt_secret_change_in_production_must_be_64_chars}
      JWT_ACCESS_EXPIRATION_MS:    ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_DAYS: ${JWT_REFRESH_EXPIRATION_DAYS:-7}
      CORS_ALLOWED_ORIGINS:       ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SPRING_PROFILES_ACTIVE:     ${SPRING_PROFILES_ACTIVE:-dev}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - bandhub-net

  # ── Frontend (Vite dev con hot-reload) ─────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: bandhub-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: /api/v1
      VITE_PROXY_TARGET: http://backend:8080
      VITE_WS_PROXY_TARGET: ws://backend:8080
    volumes:
      - ../frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - bandhub-net

networks:
  bandhub-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
